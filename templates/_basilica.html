{# Ilustração inspirada na Basílica de Lourdes (Vila Isabel): torre central, rosácea, vitrais e um coroinha com a vela. #}
<svg class="basilica {{ classe|default('') }}" viewBox="0 -32 320 392" role="img" aria-label="Ilustração da Basílica de Lourdes com um coroinha">
      <defs>
        <linearGradient id="ba-pedra" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4f6ff" />
          <stop offset="1" stop-color="#c7d0f0" />
        </linearGradient>
        <linearGradient id="ba-pedra-lado" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#dfe5fa" />
          <stop offset="1" stop-color="#aab6e3" />
        </linearGradient>
        <linearGradient id="ba-luz" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe7a3" />
          <stop offset="1" stop-color="#f5a524" />
        </linearGradient>
        <radialGradient id="ba-aura" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ffd36b" stop-opacity="0.55" />
          <stop offset="1" stop-color="#ffd36b" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- aura atrás da torre -->
      <circle class="ba-aura" cx="160" cy="120" r="120" fill="url(#ba-aura)" />

      <!-- naves laterais -->
      <path d="M38 360V200l42-46 42 46v160z" fill="url(#ba-pedra-lado)" />
      <path d="M198 360V200l42-46 42 46v160z" fill="url(#ba-pedra-lado)" />
      <!-- pináculos -->
      {% for x in [38, 122, 198, 282] %}
      <g><rect x="{{ x - 5 }}" y="176" width="10" height="30" fill="#c7d0f0"/><path d="M{{ x - 6 }} 178 L{{ x }} 156 L{{ x + 6 }} 178z" fill="#e6ebfb"/></g>
      {% endfor %}
      <!-- vitrais laterais -->
      {% for x in [62, 98, 222, 258] %}
      <path class="ba-vitral ba-v{{ loop.index0 }}" d="M{{ x - 9 }} 290 v-44 a9 12 0 0 1 18 0 v44z" fill="{{ '#7c93ff' if loop.index0 % 2 else 'url(#ba-luz)' }}" stroke="#8e9bd1" stroke-width="2"/>
      {% endfor %}

      <!-- corpo central -->
      <path d="M104 360V170l56-58 56 58v190z" fill="url(#ba-pedra)" />
      <!-- torre -->
      <rect x="132" y="70" width="56" height="70" fill="url(#ba-pedra)" />
      <path d="M128 74 L160 -2 L192 74z" fill="#e9eefc" />
      <path d="M160 -2 L192 74 H160z" fill="#cfd8f5" />
      <rect x="128" y="70" width="64" height="8" rx="2" fill="#b9c4ec" />
      <!-- cruz no topo -->
      <g class="ba-cruz">
        <rect x="157.5" y="-26" width="5" height="28" rx="1.5" fill="#f5c451" />
        <rect x="150" y="-18" width="20" height="5" rx="1.5" fill="#f5c451" />
      </g>
      <!-- janelas do campanário -->
      <path d="M146 130 v-30 a7 9 0 0 1 14 0 v30z" fill="#1b2f7a" />
      <path d="M160 130 v-30 a7 9 0 0 1 14 0 v30z" fill="#1b2f7a" />
      <circle class="ba-sino" cx="160" cy="114" r="5" fill="#f5c451" />

      <!-- rosácea -->
      <g transform="translate(160 192)">
        <circle r="30" fill="#1b2f7a" stroke="#b9c4ec" stroke-width="4" />
        <g class="ba-rosacea">
          {% for i in range(8) %}
          <ellipse rx="6" ry="13" cy="-13" transform="rotate({{ i * 45 }})" fill="{{ ['#f5c451', '#5c7cfa', '#e64980', '#20c997'][i % 4] }}" opacity="0.92"/>
          {% endfor %}
          <circle r="7" fill="#fff3c4" />
        </g>
      </g>

      <!-- porta principal com luz -->
      <path d="M134 360v-74a26 32 0 0 1 52 0v74z" fill="#8e9bd1" />
      <path class="ba-porta" d="M140 360v-72a20 26 0 0 1 40 0v72z" fill="url(#ba-luz)" />
      <!-- degraus -->
      <rect x="92" y="346" width="136" height="7" rx="2" fill="#aab6e3" />
      <rect x="80" y="353" width="160" height="7" rx="2" fill="#97a5dc" />

      <!-- coroinha -->
      <g class="ba-coroinha" transform="translate(160 306)">
        <!-- batina vermelha -->
        <path d="M-13 40 L-10 4 H10 L13 40z" fill="#d6293a" />
        <!-- sobrepeliz branca -->
        <path d="M-15 24 L-11 -2 Q0 -6 11 -2 L15 24 Q0 28 -15 24z" fill="#fff" />
        <path d="M-15 24 Q0 28 15 24" stroke="#dfe5fa" stroke-width="1.5" fill="none" />
        <!-- cabeça -->
        <circle cy="-12" r="9" fill="#f1c7a3" />
        <path d="M-9 -14 Q-8 -23 0 -22 Q9 -23 9 -13 Q4 -18 -9 -14z" fill="#5a3825" />
        <!-- braço + vela -->
        <rect x="9" y="-20" width="4" height="26" rx="1" fill="#fffbe8" />
        <circle cx="11" cy="6" r="4" fill="#f1c7a3" />
        <path class="ba-chama" d="M11 -32 C15 -26 14 -22 11 -21 C8 -22 7 -26 11 -32z" fill="#ffb02e" />
        <circle class="ba-chama-luz" cx="11" cy="-25" r="10" fill="#ffd36b" opacity="0.35" />
      </g>
    </svg>
